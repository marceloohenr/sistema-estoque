server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.guimaraesprodutos.online;
  ssl_certificate_key /etc/nginx/ssl-certificates/guimaraesprodutos.online.key;
  ssl_certificate /etc/nginx/ssl-certificates/guimaraesprodutos.online.crt;
  root /home/guimaraes/htdocs/guimaraesprodutos.online;
  location ^~ /.well-known/acme-challenge/ { auth_basic off; allow all; try_files $uri =404; }
  location / { return 301 https://guimaraesprodutos.online$request_uri; }
}
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name guimaraesprodutos.online;
  ssl_certificate_key /etc/nginx/ssl-certificates/guimaraesprodutos.online.key;
  ssl_certificate /etc/nginx/ssl-certificates/guimaraesprodutos.online.crt;
  root /home/guimaraes/htdocs/guimaraesprodutos.online;
  access_log /home/guimaraes/logs/nginx/access.log main;
  error_log /home/guimaraes/logs/nginx/error.log;
  client_max_body_size 6m;
  include /etc/nginx/global_settings;
  index index.html;
  location ^~ /.well-known/acme-challenge/ { auth_basic off; allow all; try_files $uri =404; }
  location ^~ /api/ {
    if ($scheme != 'https') { return 301 https://guimaraesprodutos.online$request_uri; }
    proxy_pass http://127.0.0.1:3187;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location ^~ /uploads/ {
    if ($scheme != 'https') { return 301 https://guimaraesprodutos.online$request_uri; }
    proxy_pass http://127.0.0.1:3187;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /assets/ {
    if ($scheme != 'https') { return 301 https://guimaraesprodutos.online$request_uri; }
    expires 1y;
    add_header Cache-Control 'public, immutable';
    add_header X-Content-Type-Options 'nosniff' always;
    try_files $uri =404;
  }
  location ~ /\. { deny all; }
  location / {
    if ($scheme != 'https') { return 301 https://guimaraesprodutos.online$request_uri; }
    add_header Cache-Control 'no-cache';
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'DENY' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
