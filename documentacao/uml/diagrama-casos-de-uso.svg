<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="titulo descricao">
<title id="titulo">Diagrama UML de Casos de Uso - SaaS de Gestão de Estoque</title><desc id="descricao">Casos de uso com relações include e extend e a condição do aviso de estoque baixo.</desc>
<defs><style>.fundo{fill:#fff}.sistema{fill:#f8fbfd;stroke:#174d78;stroke-width:3}.caso{fill:#eaf3f8;stroke:#174d78;stroke-width:2.2}.ator{fill:none;stroke:#174d78;stroke-width:3;stroke-linecap:round}.associacao{fill:none;stroke:#64748b;stroke-width:1.8}.relacao{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#seta)}.etiqueta{fill:#fff;stroke:#a8bacb;stroke-width:1}.nota{fill:#fff8d8;stroke:#a77b00;stroke-width:1.8}.titulo{font:700 29px Arial,sans-serif;fill:#123b5d}.titulo-sistema{font:700 18px Arial,sans-serif;fill:#123b5d}.rotulo{font:600 16px Arial,sans-serif;fill:#123b5d}.ator-rotulo{font:700 18px Arial,sans-serif;fill:#123b5d}.relacao-rotulo{font:italic 14px Arial,sans-serif;fill:#475569}.nota-texto{font:14px Arial,sans-serif;fill:#5f4700}.rodape{font:14px Arial,sans-serif;fill:#334155}</style><marker id="seta" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect class="fundo" width="1400" height="940"/><text x="700" y="45" text-anchor="middle" class="titulo">SaaS de Gestão de Estoque - Diagrama de Casos de Uso</text><rect x="245" y="200" width="1090" height="670" rx="12" class="sistema"/>
<!-- Atores --><circle cx="790" cy="76" r="18" class="ator"/><path d="M790 94v42m-28-26h56m-28 26l-25 38m25-38l25 38" class="ator"/><text x="790" y="194" text-anchor="middle" class="ator-rotulo">Administrador</text><circle cx="105" cy="590" r="20" class="ator"/><path d="M105 610v62m-34-38h68m-34 38l-30 48m30-48l30 48" class="ator"/><text x="105" y="742" text-anchor="middle" class="ator-rotulo">Operador de</text><text x="105" y="764" text-anchor="middle" class="ator-rotulo">Estoque</text>
<!-- Administração --><g class="caso"><ellipse cx="355" cy="285" rx="108" ry="43"/><ellipse cx="565" cy="285" rx="100" ry="41"/><ellipse cx="770" cy="285" rx="98" ry="39"/><ellipse cx="975" cy="285" rx="98" ry="39"/><ellipse cx="1190" cy="285" rx="112" ry="42"/></g><g text-anchor="middle" class="rotulo"><text x="355" y="269">Gerenciar produtos,</text><text x="355" y="291">categorias e</text><text x="355" y="313">fornecedores</text><text x="565" y="279">Gerenciar usuários</text><text x="565" y="302">e permissões</text><text x="770" y="279">Visualizar</text><text x="770" y="302">dashboard</text><text x="975" y="291">Gerar relatórios</text><text x="1190" y="279">Consultar auditoria</text><text x="1190" y="302">de movimentações</text></g>
<!-- Operação --><g class="caso"><ellipse cx="390" cy="535" rx="128" ry="38"/><ellipse cx="700" cy="535" rx="158" ry="42"/><ellipse cx="1050" cy="535" rx="158" ry="42"/><ellipse cx="600" cy="690" rx="118" ry="38"/><ellipse cx="850" cy="690" rx="118" ry="38"/><ellipse cx="1100" cy="690" rx="118" ry="38"/></g><g text-anchor="middle" class="rotulo"><text x="390" y="541">Autenticar-se</text><text x="700" y="529">Registrar movimentação</text><text x="700" y="552">de estoque</text><text x="1050" y="529">Consultar estoque</text><text x="1050" y="552">atual e histórico</text><text x="600" y="696">Registrar entrada</text><text x="850" y="696">Registrar saída</text><text x="1100" y="696">Ajustar inventário</text></g>
<!-- Aviso e condição --><g class="caso"><ellipse cx="470" cy="805" rx="158" ry="42"/></g><g text-anchor="middle" class="rotulo"><text x="470" y="799">Gerar aviso de</text><text x="470" y="822">estoque baixo</text></g><path d="M930 770h340v78H930z" class="nota"/><path d="M930 805l-32 18 32 5z" class="nota"/><text x="948" y="795" class="nota-texto">Condição do &lt;&lt;extend&gt;&gt;:</text><text x="948" y="817" class="nota-texto">após a movimentação, quantidade atual</text><text x="948" y="839" class="nota-texto">menor ou igual ao estoque mínimo.</text>
<!-- Associações --><path d="M790 194L355 242M790 194L565 244M790 194H668V350L390 497M790 194L770 246M790 194L975 246M790 194L1190 243" class="associacao"/><path d="M139 635L262 535M139 646L542 535M139 657H210V465H1050V493" class="associacao"/>
<!-- Relações include centralizadas --><path d="M770 324V440H1000V493" class="relacao"/><rect x="800" y="404" width="112" height="27" rx="6" class="etiqueta"/><text x="856" y="423" text-anchor="middle" class="relacao-rotulo">&lt;&lt;include&gt;&gt;</text><path d="M975 324V455H1070V493" class="relacao"/><rect x="990" y="458" width="112" height="27" rx="6" class="etiqueta"/><text x="1046" y="477" text-anchor="middle" class="relacao-rotulo">&lt;&lt;include&gt;&gt;</text><path d="M615 652L680 577" class="relacao"/><rect x="532" y="598" width="112" height="27" rx="6" class="etiqueta"/><text x="588" y="617" text-anchor="middle" class="relacao-rotulo">&lt;&lt;include&gt;&gt;</text><path d="M835 652L720 577" class="relacao"/><rect x="748" y="594" width="112" height="27" rx="6" class="etiqueta"/><text x="804" y="613" text-anchor="middle" class="relacao-rotulo">&lt;&lt;include&gt;&gt;</text><path d="M1060 652L750 574" class="relacao"/><rect x="900" y="584" width="112" height="27" rx="6" class="etiqueta"/><text x="956" y="603" text-anchor="middle" class="relacao-rotulo">&lt;&lt;include&gt;&gt;</text>
<!-- Extend: o aviso aponta para o caso base --><path d="M455 763L640 577" class="relacao"/><rect x="378" y="704" width="120" height="27" rx="6" class="etiqueta"/><text x="438" y="723" text-anchor="middle" class="relacao-rotulo">&lt;&lt;extend&gt;&gt;</text>
<path d="M898 823L625 805" fill="none" stroke="#a77b00" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="790" y="910" text-anchor="middle" class="rodape">O aviso de estoque baixo só é gerado quando a condição indicada na nota é atendida.</text>
</svg>
