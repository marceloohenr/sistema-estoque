<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Diagrama UML de Casos de Uso - SaaS de Gestão de Estoque</title><desc id="desc">Administrador e Operador de Estoque utilizam funcionalidades de gestão de estoque.</desc>
<defs><style>.bg{fill:#fff}.system{fill:#f8fbfd;stroke:#174d78;stroke-width:3}.uc{fill:#eaf3f8;stroke:#174d78;stroke-width:2}.actor{fill:none;stroke:#174d78;stroke-width:3;stroke-linecap:round}.assoc{fill:none;stroke:#64748b;stroke-width:1.8}.rel{fill:none;stroke:#64748b;stroke-width:1.7;stroke-dasharray:7 5;marker-end:url(#arrow)}.title{font:700 29px Arial,sans-serif;fill:#123b5d}.systemtitle{font:700 18px Arial,sans-serif;fill:#123b5d}.label{font:600 16px Arial,sans-serif;fill:#123b5d}.actorlabel{font:700 18px Arial,sans-serif;fill:#123b5d}.reltext{font:italic 13px Arial,sans-serif;fill:#475569}.note{font:14px Arial,sans-serif;fill:#334155}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect class="bg" width="1400" height="900"/><text x="700" y="44" text-anchor="middle" class="title">SaaS de Gestão de Estoque - Diagrama de Casos de Uso</text>
<!-- administrador --><circle cx="700" cy="88" r="18" class="actor"/><path d="M700 106v42m-28-26h56m-28 26l-25 38m25-38l25 38" class="actor"/><text x="700" y="207" text-anchor="middle" class="actorlabel">Administrador</text>
<rect x="165" y="225" width="1170" height="570" rx="12" class="system"/><text x="750" y="257" text-anchor="middle" class="systemtitle">SaaS de Gestão de Estoque</text>
<!-- casos administrativos --><g class="uc"><ellipse cx="345" cy="355" rx="138" ry="38"/><ellipse cx="610" cy="355" rx="138" ry="38"/><ellipse cx="875" cy="355" rx="138" ry="38"/><ellipse cx="1140" cy="355" rx="138" ry="38"/></g><g text-anchor="middle" class="label"><text x="345" y="350">Gerenciar produtos,</text><text x="345" y="371">categorias e fornecedores</text><text x="610" y="350">Gerenciar usuários</text><text x="610" y="371">e permissões</text><text x="875" y="350">Visualizar dashboard</text><text x="875" y="371">e gerar relatórios</text><text x="1140" y="350">Consultar auditoria</text><text x="1140" y="371">de movimentações</text></g>
<!-- operador --><circle cx="78" cy="530" r="20" class="actor"/><path d="M78 550v62m-34-38h68m-34 38l-30 48m30-48l30 48" class="actor"/><text x="78" y="680" text-anchor="middle" class="actorlabel">Operador de</text><text x="78" y="702" text-anchor="middle" class="actorlabel">Estoque</text>
<!-- casos operacionais --><g class="uc"><ellipse cx="360" cy="520" rx="135" ry="35"/><ellipse cx="650" cy="520" rx="155" ry="39"/><ellipse cx="970" cy="520" rx="155" ry="39"/><ellipse cx="1130" cy="660" rx="155" ry="39"/></g><g text-anchor="middle" class="label"><text x="360" y="526">Autenticar-se</text><text x="650" y="515">Registrar movimentações</text><text x="650" y="536">de estoque</text><text x="970" y="515">Consultar estoque</text><text x="970" y="536">atual e histórico</text><text x="1130" y="655">Consultar avisos de</text><text x="1130" y="676">estoque baixo</text></g>
<!-- detalhes da movimentação --><g class="uc"><ellipse cx="470" cy="675" rx="120" ry="35"/><ellipse cx="735" cy="675" rx="120" ry="35"/><ellipse cx="900" cy="730" rx="120" ry="35"/></g><g text-anchor="middle" class="label"><text x="470" y="681">Registrar entrada</text><text x="735" y="681">Registrar saída</text><text x="900" y="725">Ajustar inventário</text></g>
<!-- associações sem cruzamento de caixas -->
<path d="M700 186V287L345 317M700 186V287L610 317M700 186V287L875 317M700 186V287L1140 317" class="assoc"/>
<!-- ligações do operador --> <path d="M112 570L225 520M112 582L495 520M112 594L815 520" class="assoc"/>
<!-- relações UML -->
<path d="M650 559V638L470 650M650 559V638L735 650M650 559V680L820 712" class="rel"/><text x="512" y="630" class="reltext">&lt;&lt;include&gt;&gt;</text><text x="680" y="630" class="reltext">&lt;&lt;include&gt;&gt;</text><text x="742" y="701" class="reltext">&lt;&lt;include&gt;&gt;</text>
<path d="M970 559L1085 630" class="rel"/><text x="1007" y="605" class="reltext">&lt;&lt;extend&gt;&gt;</text><path d="M875 393L970 480" class="rel"/><text x="913" y="446" class="reltext">&lt;&lt;include&gt;&gt;</text>
<text x="750" y="845" text-anchor="middle" class="note">As movimentações incluem entrada, saída e ajuste de inventário. O sistema gera avisos quando o saldo atinge o estoque mínimo.</text>
</svg>
