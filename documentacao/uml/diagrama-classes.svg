<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama UML de Classes - SaaS de Gestão de Estoque</title><desc id="desc">Classes de usuários, produtos, estoque, movimentações, alertas, categorias e fornecedores.</desc>
  <defs><style>.bg{fill:#fff}.box{fill:#eaf3f8;stroke:#1f4e78;stroke-width:2}.line{stroke:#1f4e78;stroke-width:1.6}.dep{stroke:#64748b;stroke-width:1.6;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}.assoc{stroke:#64748b;stroke-width:1.7;fill:none}.title{font:700 28px Arial,sans-serif;fill:#123b5d}.head{font:700 18px Arial,sans-serif;fill:#123b5d}.txt{font:14px Arial,sans-serif;fill:#243b53}.stereo{font:13px Arial,sans-serif;fill:#475569}.mult{font:13px Arial,sans-serif;fill:#334155}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs>
  <rect width="1400" height="940" class="bg"/><text x="700" y="43" text-anchor="middle" class="title">SaaS de Gestão de Estoque - Diagrama de Classes</text>
  <!-- Usuario --><g transform="translate(70,100)"><rect width="285" height="235" rx="6" class="box"/><line x1="0" y1="42" x2="285" y2="42" class="line"/><line x1="0" y1="185" x2="285" y2="185" class="line"/><text x="142" y="27" text-anchor="middle" class="head">Usuario</text><text x="14" y="65" class="txt">+ id: UUID</text><text x="14" y="85" class="txt">+ nome: String</text><text x="14" y="105" class="txt">+ email: String</text><text x="14" y="125" class="txt">+ senhaHash: String</text><text x="14" y="145" class="txt">+ perfil: PerfilUsuario</text><text x="14" y="165" class="txt">+ ativo: Boolean</text><text x="14" y="210" class="txt">+ autenticar()</text></g>
  <!-- Categoria --><g transform="translate(70,430)"><rect width="285" height="145" rx="6" class="box"/><line x1="0" y1="42" x2="285" y2="42" class="line"/><text x="142" y="27" text-anchor="middle" class="head">Categoria</text><text x="14" y="67" class="txt">+ id: UUID</text><text x="14" y="90" class="txt">+ nome: String</text><text x="14" y="113" class="txt">+ descricao: String</text></g>
  <!-- Fornecedor --><g transform="translate(70,675)"><rect width="285" height="195" rx="6" class="box"/><line x1="0" y1="42" x2="285" y2="42" class="line"/><text x="142" y="27" text-anchor="middle" class="head">Fornecedor</text><text x="14" y="67" class="txt">+ id: UUID</text><text x="14" y="90" class="txt">+ nome: String</text><text x="14" y="113" class="txt">+ cnpj: String</text><text x="14" y="136" class="txt">+ telefone: String</text><text x="14" y="159" class="txt">+ email: String</text></g>
  <!-- Produto --><g transform="translate(550,115)"><rect width="305" height="240" rx="6" class="box"/><line x1="0" y1="42" x2="305" y2="42" class="line"/><line x1="0" y1="186" x2="305" y2="186" class="line"/><text x="152" y="27" text-anchor="middle" class="head">Produto</text><text x="14" y="66" class="txt">+ id: UUID</text><text x="14" y="87" class="txt">+ codigo: String</text><text x="14" y="108" class="txt">+ nome: String</text><text x="14" y="129" class="txt">+ unidadeMedida: String</text><text x="14" y="150" class="txt">+ estoqueMinimo: Decimal</text><text x="14" y="171" class="txt">+ ativo: Boolean</text><text x="14" y="214" class="txt">+ validarSaldo()</text></g>
  <!-- Estoque --><g transform="translate(550,465)"><rect width="305" height="150" rx="6" class="box"/><line x1="0" y1="42" x2="305" y2="42" class="line"/><line x1="0" y1="90" x2="305" y2="90" class="line"/><text x="152" y="27" text-anchor="middle" class="head">Estoque</text><text x="14" y="66" class="txt">+ id: UUID</text><text x="14" y="84" class="txt">+ quantidadeAtual: Decimal</text><text x="14" y="113" class="txt">+ atualizarSaldo()</text><text x="14" y="135" class="txt">+ estaAbaixoDoMinimo()</text></g>
  <!-- Movimentacao --><g transform="translate(1010,105)"><rect width="325" height="220" rx="6" class="box"/><line x1="0" y1="42" x2="325" y2="42" class="line"/><line x1="0" y1="166" x2="325" y2="166" class="line"/><text x="162" y="27" text-anchor="middle" class="head">MovimentacaoEstoque</text><text x="14" y="66" class="txt">+ id: UUID</text><text x="14" y="87" class="txt">+ tipo: TipoMovimentacao</text><text x="14" y="108" class="txt">+ quantidade: Decimal</text><text x="14" y="129" class="txt">+ dataHora: DateTime</text><text x="14" y="150" class="txt">+ motivo: String</text><text x="14" y="191" class="txt">+ registrar()</text></g>
  <!-- Alerta --><g transform="translate(1010,510)"><rect width="325" height="175" rx="6" class="box"/><line x1="0" y1="42" x2="325" y2="42" class="line"/><line x1="0" y1="132" x2="325" y2="132" class="line"/><text x="162" y="27" text-anchor="middle" class="head">AlertaEstoque</text><text x="14" y="66" class="txt">+ id: UUID</text><text x="14" y="87" class="txt">+ mensagem: String</text><text x="14" y="108" class="txt">+ dataGeracao: DateTime</text><text x="14" y="126" class="txt">+ lido: Boolean</text><text x="14" y="155" class="txt">+ marcarComoLido()</text></g>
  <!-- relationships -->
  <path d="M355 502H470V225H550" class="assoc"/><text x="365" y="491" class="mult">1</text><text x="525" y="214" class="mult">0..*</text><text x="385" y="478" class="stereo">classifica</text>
  <path d="M355 762H500V280H550" class="assoc"/><text x="365" y="751" class="mult">1</text><text x="525" y="269" class="mult">0..*</text><text x="400" y="738" class="stereo">fornece</text>
  <path d="M702 355V465" class="assoc"/><text x="680" y="375" class="mult">1</text><text x="680" y="452" class="mult">1</text><polygon points="702,355 710,363 702,371 694,363" fill="#1f4e78"/><text x="716" y="416" class="stereo">possui</text>
  <path d="M855 225H1010" class="assoc"/><text x="868" y="214" class="mult">1</text><text x="986" y="214" class="mult">0..*</text><text x="905" y="205" class="stereo">movimenta</text>
  <path d="M355 205H465V90H1172V105" class="assoc"/><text x="365" y="194" class="mult">1</text><text x="1180" y="94" class="mult">0..*</text><text x="670" y="82" class="stereo">registra</text>
  <path d="M855 275H940V597H1010" class="assoc"/><text x="868" y="264" class="mult">1</text><text x="987" y="587" class="mult">0..*</text><text x="948" y="570" class="stereo">gera</text>
  <path d="M1172 325V420H890V580H855" class="dep"/><text x="935" y="411" class="stereo">atualiza saldo</text>
  <text x="70" y="903" class="txt">Enumerações: PerfilUsuario { ADMINISTRADOR, OPERADOR } | TipoMovimentacao { ENTRADA, SAIDA, AJUSTE }</text>
</svg>
